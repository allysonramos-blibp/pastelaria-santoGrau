# Porta da API (compativel com Render $PORT e local 8080)
server.port=${PORT:8080}
spring.application.name=pastelaria-api

# Perfil ativo padrao (dev usa H2, prod usa Neon/PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuracao padrao de desenvolvimento (H2 em memoria)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pastelariadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (disponivel apenas localmente)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.pastelaria=INFO
